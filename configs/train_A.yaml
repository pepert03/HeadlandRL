# Paso A: entrenamiento PPO SIN aleatorizacion (condicion A, referencia inferior).
# Geometria y vehiculo fijos (Twizy de referencia); recompensa v0 provisional.
condition: A
dr_mode: fixed
privileged: false
n_envs: 8
total_timesteps: 3000000
curriculum_steps: 2000000
eval_freq: 10000
n_eval_episodes: 10
# la politica actua en [-1,1]^2 (wrapper NormalizedActions en build_env)
normalize_actions: true

env:
  dt: 0.1        # 10 Hz, como el control de move_base; maniobra ~200 pasos
  max_steps: 500  # 50 s
  pos_tol: 0.30
  ang_tol_deg: 10.0
  # curriculum (callback): tolerancias 2.0m/90deg -> estrictas y
  # velocidad 0.4 -> 0.83 m/s y tiempo de cambio de marcha 0 -> 1 s durante
  # los primeros curriculum_steps
  fixed_vehicle: {L: 1.69, delta_max_deg: 26.0, tau_v: 0.3, tau_delta: 0.5, v_max: 0.83}
  fixed_crop: {row_spacing: 2.5, headland_width: 6.0, n_lanes: 1, row_width: 0.5, crop_depth: 5.0, x_margin: 2.0, y_margin_top: 1.0}
  # progreso a lo largo de la referencia (w_ref_progress) en vez del euclideo,
  # que castiga el tramo marcha atras; w_time por paso = 1/s a 10 Hz
  reward: {w_progress: 0.0, w_ref_progress: 3.0, w_gear_switch: 2.0, w_angle: 0.0, w_time: 0.1, w_smooth: 0.005, success_bonus: 100.0, collision_penalty: -10.0, zone_bonus: 10.0, zone_pos: 1.0, zone_ang_deg: 45.0}

# Referencia experta para backplay (3 puntos, estricto). Sin ella el caso
# nominal no se descubre (Dubins solo-avance infactible con H=6, Rmin=3.47).
reference: data/references/reference_A.npy

ppo:
  learning_rate: 0.0003
  n_steps: 1024
  batch_size: 256
  n_epochs: 10
  gamma: 0.995
  gae_lambda: 0.95
  clip_range: 0.2
  ent_coef: 0.02
  vf_coef: 0.5
  max_grad_norm: 0.5
  net_arch: [64, 64]
  # Exploracion (v_max=0.83 m/s + cambio de marcha): con std inicial 1 el
  # signo de v_cmd cambia casi cada paso, el coche frena para cambiar de
  # marcha sin completarlo nunca y PPO converge a quedarse parado.
  # Ruido menor y correlacionado en el tiempo (gSDE).
  log_std_init: -1.0
  use_sde: true
  sde_sample_freq: 8
